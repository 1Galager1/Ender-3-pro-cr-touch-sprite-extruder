name: Build Marlin (robust patch)
on:
  workflow_dispatch:

env:
  MARLIN_VERSION: "bugfix-2.1.x"
  BUILD_ENV: "STM32F103RE_creality"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (your config files)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git
          pip3 install -U platformio

      - name: Clone Marlin at specified tag/branch
        run: |
          git clone https://github.com/MarlinFirmware/Marlin.git marlin
          cd marlin
          git fetch --tags
          git checkout "${{ env.MARLIN_VERSION }}"

      - name: Apply safe patches to Marlin/Configuration.h (inline Python)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          cfg_path = Path("marlin/Marlin/Configuration.h")
          if not cfg_path.exists():
              print("ERROR: marlin/Marlin/Configuration.h not found")
              sys.exit(1)

          text = cfg_path.read_text(encoding="utf-8")

          def replace_min_probe_with_probing_margin(t):
              m = re.search(r'^\s*#\s*define\s+MIN_PROBE_EDGE\s+([0-9]+)', t, re.MULTILINE)
              if m:
                  val = m.group(1)
                  t = re.sub(r'^\s*#\s*define\s+MIN_PROBE_EDGE\s+[0-9]+', f'#define PROBING_MARGIN {val}', t, flags=re.MULTILINE)
              elif 'PROBING_MARGIN' not in t:
                  t = t + "\n#define PROBING_MARGIN 10\n"
              return t

          def ensure_define(t, name, value=None):
              pat = re.compile(r'^\s*#\s*define\s+' + re.escape(name) + r'(?:\s+.*)?$', re.MULTILINE)
              if value is None:
                  if not pat.search(t):
                      t = t + f"\n#define {name}\n"
              else:
                  if pat.search(t):
                      t = pat.sub(f'#define {name} {value}', t)
                  else:
                      t = t + f"\n#define {name} {value}\n"
              return t

          # 0) Replace MIN_PROBE_EDGE with PROBING_MARGIN if needed
          text = replace_min_probe_with_probing_margin(text)

          # 1) Ensure MOTHERBOARD is Creality V4.2.2
          if re.search(r'^\s*#\s*define\s+MOTHERBOARD\s+.*', text, re.MULTILINE):
              text = re.sub(r'^\s*#\s*define\s+MOTHERBOARD\s+.*', '#define MOTHERBOARD BOARD_CREALITY_V422', text, flags=re.MULTILINE)
          else:
              text += "\n#define MOTHERBOARD BOARD_CREALITY_V422\n"

          # 2) DEFAULT_AXIS_STEPS_PER_UNIT (X Y Z E)
          pat_steps = re.compile(r'^\s*#\s*define\s+DEFAULT_AXIS_STEPS_PER_UNIT\s+{[^}]+}', re.MULTILINE)
          steps_value = "{ 80, 80, 400, 424.9 }"
          if pat_steps.search(text):
              text = pat_steps.sub(f'#define DEFAULT_AXIS_STEPS_PER_UNIT   {steps_value}', text)
          else:
              text = text + f"\n#define DEFAULT_AXIS_STEPS_PER_UNIT   {steps_value}\n"

          # 3) Ensure knob 12864 controller macro exists
          if "REPRAP_DISCOUNT_FULL_GRAPHIC_SMART_CONTROLLER" not in text:
              text += "\n#define REPRAP_DISCOUNT_FULL_GRAPHIC_SMART_CONTROLLER\n"

          # 4) Ensure BLTOUCH and Z_SAFE_HOMING
          if "BLTOUCH" not in text:
              text += "\n#define BLTOUCH\n"
          if "Z_SAFE_HOMING" not in text:
              text += "\n#define Z_SAFE_HOMING\n"

          # 5) Enable AUTO_BED_LEVELING_BILINEAR and grid
          if "AUTO_BED_LEVELING_BILINEAR" not in text:
              text += "\n#define AUTO_BED_LEVELING_BILINEAR\n"
          if "GRID_MAX_POINTS_X" not in text:
              text += "\n#define GRID_MAX_POINTS_X 3\n"

          # 6) Ensure PROBING_MARGIN exists
          if "PROBING_MARGIN" not in text:
              text += "\n#define PROBING_MARGIN 10\n"

          # 7) Probe offset placeholder if missing
          if "NOZZLE_TO_PROBE_OFFSET" not in text:
              text += "\n#define NOZZLE_TO_PROBE_OFFSET { -44, -9, 0 } // PLACEHOLDER - measure and update\n"

          # 8) EEPROM
          if "EEPROM_SETTINGS" not in text:
              text += "\n#define EEPROM_SETTINGS\n"

          # 9) Default filament diameter
          if "DEFAULT_NOMINAL_FILAMENT_DIA" not in text:
              text += "\n#define DEFAULT_NOMINAL_FILAMENT_DIA 1.75\n"

                    # 10) Ensure FAN_SOFT_PWM is enabled (force uncomment/add)
          fan_pat = re.compile(r'^\s*//?\s*#\s*define\s+FAN_SOFT_PWM', re.MULTILINE)
          if fan_pat.search(text):
              # If it exists (commented or not), replace it with active version
              text = fan_pat.sub('#define FAN_SOFT_PWM', text)
          else:
              # If it doesn't exist at all, add it
              text += "\n#define FAN_SOFT_PWM\n"

          # 11) Ensure SERIAL_PORT is set to a valid number 1..9 (set to 1 if missing/invalid)
          ser_match = re.search(r'^\s*#\s*define\s+SERIAL_PORT\s+(-?\d+)', text, re.MULTILINE)
          if ser_match:
              text = re.sub(r'^\s*#\s*define\s+SERIAL_PORT\s+(-?\d+)', '#define SERIAL_PORT 1', text, flags=re.MULTILINE)
          else:
              text += "\n#define SERIAL_PORT 1\n"

          cfg_path.write_text(text, encoding="utf-8")
          print('Patched marlin/Marlin/Configuration.h with user settings (safe-mode).')
          PY

      - name: Apply safe patches to Marlin/Configuration_adv.h (inline Python)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          cfg_adv_path = Path("marlin/Marlin/Configuration_adv.h")
          if not cfg_adv_path.exists():
              print("ERROR: marlin/Marlin/Configuration_adv.h not found")
              sys.exit(1)

          text = cfg_adv_path.read_text(encoding="utf-8")

          # Enable RESTORE_LEVELING_AFTER_G28 (restore mesh after G28)
          restore_pat = re.compile(r'^\s*(//\s*)?#\s*define\s+RESTORE_LEVELING_AFTER_G28', re.MULTILINE)
          if restore_pat.search(text):
              # If it exists (commented or not), replace it with active version
              text = restore_pat.sub('#define RESTORE_LEVELING_AFTER_G28', text)
          else:
              # If it doesn't exist at all, add it
              text += "\n#define RESTORE_LEVELING_AFTER_G28\n"

          # Enable ENABLE_LEVELING_FADE_HEIGHT for fade over first layers
          fade_pat = re.compile(r'^\s*(//\s*)?#\s*define\s+ENABLE_LEVELING_FADE_HEIGHT', re.MULTILINE)
          if fade_pat.search(text):
              # If it exists (commented or not), replace it with active version
              text = fade_pat.sub('#define ENABLE_LEVELING_FADE_HEIGHT', text)
          else:
              # If it doesn't exist at all, add it
              text += "\n#define ENABLE_LEVELING_FADE_HEIGHT\n"

          # Enable ENABLE_LEVELING_FADE_ONLY_ONCE (fade only once)
          fade_once_pat = re.compile(r'^\s*(//\s*)?#\s*define\s+ENABLE_LEVELING_FADE_ONLY_ONCE', re.MULTILINE)
          if fade_once_pat.search(text):
              # If it exists (commented or not), replace it with active version
              text = fade_once_pat.sub('#define ENABLE_LEVELING_FADE_ONLY_ONCE', text)
          else:
              # If it doesn't exist at all, add it
              text += "\n#define ENABLE_LEVELING_FADE_ONLY_ONCE\n"

          # BLTouch delay settings
          bltouch_delay_pat = re.compile(r'^\s*(//\s*)?#\s*define\s+BLTOUCH_DELAY(?:\s+\d+)?', re.MULTILINE)
          if bltouch_delay_pat.search(text):
              # If it exists (commented or not), replace it with active version
              text = bltouch_delay_pat.sub('#define BLTOUCH_DELAY 500', text)
          else:
              # If it doesn't exist at all, add it
              text += "\n#define BLTOUCH_DELAY 500\n"

          cfg_adv_path.write_text(text, encoding="utf-8")
          print('Patched marlin/Marlin/Configuration_adv.h with user settings (safe-mode).')
          PY

      - name: Build Marlin with PlatformIO
        working-directory: ./marlin
        run: |
          platformio run -e "${{ env.BUILD_ENV }}"
        env:
          PIO_HOME_DIR: ${{ runner.temp }}/.platformio

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            ./marlin/.pio/build/${{ env.BUILD_ENV }}/firmware.bin
            ./marlin/.pio/build/${{ env.BUILD_ENV }}/firmware.hex
            ./marlin/.pio/build/${{ env.BUILD_ENV }}/firmware.uf2
            ./marlin/.pio/build/${{ env.BUILD_ENV }}/*.bin
            ./marlin/.pio/build/${{ env.BUILD_ENV }}/*.hex

      - name: Success message
        if: success()
        run: echo "Build finished. Download firmware from Actions -> build -> Artifacts -> firmware-bin."
